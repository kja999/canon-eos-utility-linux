[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-eos-utility"
version = "0.1.0"
description = "Qt GUI client for Linux to control Canon EOS cameras and download images over WiFi (PTP/IP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "canon-eos-utility-linux contributors" }]
keywords = ["canon", "eos", "ptp", "ptpip", "camera", "wifi", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture",
]
dependencies = [
    "PySide6>=6.5",
    "zeroconf>=0.130",
    "exif>=1.6",
]

[project.optional-dependencies]
mock = ["Pillow>=9.0"]
dev = ["pytest>=7.0", "Pillow>=9.0"]

[project.scripts]
canon-eos-utility = "canon_eos_utility.__main__:main"
canon-eos-mock = "canon_eos_utility.mock.__main__:main"
canon-eos-daemon = "canon_eos_utility.daemon:main"

[project.gui-scripts]
canon-eos-utility-gui = "canon_eos_utility.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"canon_eos_utility.ui" = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
