# Flatpak manifest for Canon EOS Utility.
# Build:
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flatpak/org.problem_child.CanonEOSUtility.yml
#
# Runs on the GNOME runtime. The previous io.qt.PySide.BaseApp base app is
# built on org.kde.Platform and strips the Qt bundled in the PySide6 wheel,
# which forced this app onto the KDE runtime. Instead the full PySide6 wheel
# (which ships its own Qt 6.11, including platform plugins) is installed
# directly, so no KDE libraries are needed at all.
app-id: org.problem_child.CanonEOSUtility
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: canon-eos-utility

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download

modules:
  - name: python3-modules
    buildsystem: simple
    build-commands:
      - >
        pip3 install --verbose --exists-action=i --no-index
        --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation
        "PySide6==6.11.2" "zeroconf==0.151.5" "exif==1.6.1"
