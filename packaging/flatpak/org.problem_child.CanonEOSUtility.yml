  - name: canon-eos-utility
    buildsystem: simple
    build-commands:
      - |
        PYVER=$(python3 -c "import sys;print('%d.%d' % sys.version_info[:2])")
        install -d "/app/lib/python${PYVER}/site-packages"
        cp -r src/canon_eos_utility "/app/lib/python${PYVER}/site-packages/"
      - |
        install -d /app/bin
        install -Dm755 packaging/flatpak/canon-eos-utility /app/bin/canon-eos-utility
      - install -Dm644 packaging/org.problem_child.CanonEOSUtility.desktop
        /app/share/applications/org.problem_child.CanonEOSUtility.desktop
      - install -Dm644 packaging/org.problem_child.CanonEOSUtility.metainfo.xml
        /app/share/metainfo/org.problem_child.CanonEOSUtility.metainfo.xml
      - install -Dm644 packaging/icons/org.problem_child.CanonEOSUtility.svg
        /app/share/icons/hicolor/scalable/apps/org.problem_child.CanonEOSUtility.svg
      - install -Dm644 LICENSE
        /app/share/licenses/org.problem_child.CanonEOSUtility/LICENSE
    sources:
      - type: dir
        path: ../..
